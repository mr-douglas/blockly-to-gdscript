name: Browser check
# Builds the site, opens several game examples in headless Chrome, and pushes
# screenshots of the loading bar and the running games to the ci-browser branch.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: browser-check
  cancel-in-progress: true
jobs:
  browser:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .cache/godot/web-4.6.3.zip
          key: godot-web-nothreads-release-4.6.3
      - name: Build the site
        run: bash runner/build.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless Chrome
        run: |
          npm install --silent --prefix "$RUNNER_TEMP/pw" playwright@1.49.1
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - name: Open the games
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          SITE: site
          SHOTS: ${{ runner.temp }}/browser
        run: node .github/browser-shots.cjs
      - name: Publish to the ci-browser branch
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/browser"
          cd "$RUNNER_TEMP/browser"
          git init -q -b ci-browser
          git config user.name "github-actions[bot]"
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -qm "Browser screenshots for ${GITHUB_SHA}" --allow-empty
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-browser
